<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset skanera</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#eef7ef;color:#173320;padding:18px}
    main{width:min(720px,100%);background:white;border-radius:24px;padding:24px;box-shadow:0 20px 50px rgba(20,107,57,.16)}
    h1{margin-top:0}.log{white-space:pre-wrap;background:#f3f7f4;border-radius:16px;padding:14px;color:#66746b;line-height:1.55}
    a,button{display:inline-flex;margin-top:14px;background:#1f8a4c;color:white;border:0;border-radius:14px;padding:13px 18px;font-weight:800;text-decoration:none}
  </style>
</head>
<body>
<main>
  <h1>Czyszczę starą wersję PWA</h1>
  <p>Ten plik usuwa service worker i cache, które trzymały ostatnie wersje mimo wgrywania starszych plików.</p>
  <div id="log" class="log">Start...</div>
  <button id="go" hidden>Otwórz v1002</button>
</main>
<script>
const log = document.getElementById("log");
const go = document.getElementById("go");
function add(t){ log.textContent += "\n" + t; }
async function reset(){
  try{
    add("1. Usuwam service workery...");
    if ("serviceWorker" in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      for (const r of regs) await r.unregister();
      add("Usunięto service workerów: " + regs.length);
    }
    add("2. Usuwam cache aplikacji...");
    if ("caches" in window) {
      const keys = await caches.keys();
      for (const k of keys) await caches.delete(k);
      add("Usunięto cache: " + keys.length);
    }
    add("3. Gotowe. Otwieram czystą wersję v1002...");
    go.hidden = false;
    go.onclick = () => location.href = "./index.html?clean=" + Date.now();
    setTimeout(() => location.href = "./index.html?clean=" + Date.now(), 1800);
  }catch(e){ add("Błąd: " + e.message); go.hidden = false; }
}
reset();
</script>
</body>
</html>
